<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <script>document.documentElement.dataset.theme=localStorage.getItem('festival-theme')||'dark'</script>
  <title>Festival Setlist Creator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0/index.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0/default.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">🎪 Festival Setlist Creator</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">☾/☀</button>
    </header>

    <main id="main-content">
      <section class="card">
        <h2 class="card-title">Search Artists</h2>
        <div class="search-box">
          <input
            type="text"
            id="artist-input"
            class="input"
            placeholder="Artist name..."
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-results"
            aria-autocomplete="list"
            aria-haspopup="listbox"
          />
          <div id="search-spinner" class="spinner hidden"></div>
        </div>
        <div id="search-results" class="dropdown hidden" role="listbox" aria-label="Artist suggestions"></div>
      </section>

      <section class="card" id="artists-card">
        <h2 class="card-title">Your Festival Lineup</h2>
        <div id="empty-list-msg" class="empty-state">
          <div class="empty-state-ring" aria-hidden="true">+</div>
          <p class="empty-state-text">Search above to add artists to your lineup.</p>
        </div>
        <ul id="artist-list" class="artist-list" aria-label="Festival lineup" aria-live="polite"></ul>

        <!-- ── Playlist options ── -->
        <div class="options-group hidden" id="options-group">
          <label class="option-label">
            <input type="checkbox" id="opt-prefer-original" checked />
            <span>
              <strong>Prefer original recording</strong>
              <span class="option-hint">When an artist plays a cover, save the original version. If not found on Spotify, falls back to the cover by the performing artist.</span>
            </span>
          </label>
          <label class="option-label">
            <input type="checkbox" id="opt-include-taped" />
            <span>
              <strong>Include taped / backing tracks</strong>
              <span class="option-hint">Include songs played from a recording (not performed live), whether by the artist or not.</span>
            </span>
          </label>

          <!-- ── Playlist name ── -->
          <div class="playlist-name-group">
            <label class="playlist-name-label" for="playlist-name-input">Playlist name <span class="option-hint">(optional)</span></label>
            <input
              type="text"
              id="playlist-name-input"
              class="input"
              autocomplete="off"
              maxlength="100"
            />
          </div>
        </div>

        <button id="create-btn" class="btn btn-primary btn-full hidden">
          <span id="create-label">Create Festival Setlist</span>
          <span id="create-spinner" class="spinner hidden"></span>
        </button>
      </section>

      <section class="card hidden" id="result-card">
        <h2 class="card-title">Your Playlist is Ready!</h2>

        <!-- ── Missing tracks warning ── -->
        <div id="warning-box" class="warning-box hidden"></div>

        <div id="artist-summary" class="summary-list"></div>
        <a id="playlist-link" href="#" target="_blank" class="btn btn-spotify">
          Open in Spotify
        </a>
        <div id="player-wrap" class="player-wrap"></div>
        <button id="reset-btn" class="btn btn-ghost btn-full">Create Another</button>
      </section>
    </main>
  </div>

  <footer>
    <a href="https://github.com/based-on-what/festival-setlistfm" target="_blank" rel="noopener noreferrer">
      Festival Setlist Creator — Coded with ❤️ by @based-on-what
    </a>
  </footer>

  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
